<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VIP Meet</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top,#21145e,#080812 45%,#030307);
  color:white;
  min-height:100vh;
}

button,input{
  font:inherit;
}

.hidden{
  display:none!important;
}

.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:500px;
  padding:30px;
  border-radius:25px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(20px);
  box-shadow:0 0 50px rgba(120,70,255,.25);
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  margin-bottom:8px;
  background:linear-gradient(90deg,#8c7bff,#00eaff,#ff55d9);
  -webkit-background-clip:text;
  color:transparent;
}

.sub{
  text-align:center;
  color:#aaa;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:15px;
  margin:8px 0;
  border-radius:14px;
  border:1px solid #444;
  outline:none;
  background:#10101a;
  color:white;
}

.btn{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:14px;
  cursor:pointer;
  color:white;
  font-weight:bold;
  background:linear-gradient(90deg,#6847ff,#00bfff);
  box-shadow:0 0 25px rgba(75,100,255,.3);
}

.btn.secondary{
  background:#242431;
}

.btn.danger{
  background:#d9365f;
}

#waiting{
  text-align:center;
}

.loader{
  width:45px;
  height:45px;
  border:4px solid #333;
  border-top-color:#00eaff;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:20px auto;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* MEETING */

#meeting{
  display:none;
  min-height:100vh;
  background:#050509;
}

.topbar{
  height:70px;
  padding:12px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(15,15,25,.92);
  border-bottom:1px solid #252533;
}

.brand{
  font-size:22px;
  font-weight:900;
}

.roomInfo{
  color:#aaa;
  font-size:13px;
}

.copy{
  padding:9px 13px;
  border:0;
  border-radius:10px;
  background:#242432;
  color:white;
  cursor:pointer;
}

.content{
  padding:15px;
  padding-bottom:100px;
}

.videos{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:15px;
}

.videoCard{
  position:relative;
  min-height:230px;
  background:#11111a;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #292938;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.videoCard video{
  width:100%;
  height:100%;
  min-height:230px;
  object-fit:cover;
  background:#000;
  display:block;
}

.nameTag{
  position:absolute;
  left:12px;
  bottom:12px;
  padding:7px 11px;
  border-radius:10px;
  background:rgba(0,0,0,.65);
  font-size:13px;
}

.hostBadge{
  color:#ffd45a;
}

.controls{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  background:rgba(20,20,28,.95);
  border:1px solid #333341;
  border-radius:20px;
  z-index:20;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.control{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  cursor:pointer;
  background:#292936;
  color:white;
  font-size:19px;
}

.control.active{
  background:#6847ff;
}

.control.off{
  background:#d9365f;
}

.leave{
  background:#e5395f;
}

.volume{
  width:90px;
}

.approvals{
  position:fixed;
  right:15px;
  top:85px;
  width:290px;
  max-width:calc(100vw - 30px);
  padding:15px;
  background:rgba(18,18,27,.97);
  border:1px solid #343444;
  border-radius:18px;
  z-index:30;
}

.approvals h3{
  margin-bottom:10px;
}

.request{
  padding:10px;
  border-radius:12px;
  background:#252532;
  margin-top:8px;
}

.request button{
  border:0;
  border-radius:8px;
  padding:7px 10px;
  cursor:pointer;
  color:white;
  margin-right:5px;
}

.approve{
  background:#2ca66f;
}

.reject{
  background:#d9365f;
}

.status{
  position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  padding:10px 16px;
  background:#20202b;
  border:1px solid #383847;
  border-radius:12px;
  z-index:40;
  display:none;
}

@media(max-width:600px){
  .topbar{
    height:62px;
  }

  .brand{
    font-size:18px;
  }

  .videos{
    grid-template-columns:1fr;
  }

  .videoCard{
    min-height:210px;
  }

  .videoCard video{
    min-height:210px;
  }

  .controls{
    width:calc(100% - 20px);
    justify-content:center;
    gap:5px;
  }

  .control{
    width:43px;
    height:43px;
  }

  .volume{
    width:65px;
  }
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page">
  <div class="card">

    <div class="logo">VIP MEET</div>

    <div class="sub">
      Private HD Video Meeting
    </div>

    <input id="name" placeholder="Enter your name">

    <input id="roomId" placeholder="Meeting ID">

    <button class="btn" onclick="createMeeting()">
      👑 Create Meeting
    </button>

    <button class="btn secondary" onclick="joinMeeting()">
      🚀 Join Meeting
    </button>

  </div>
</div>


<!-- WAITING -->
<div id="waiting" class="page hidden">
  <div class="card">

    <div class="logo">WAITING</div>

    <div class="loader"></div>

    <p id="waitingText">
      Waiting for host approval...
    </p>

    <button class="btn danger" onclick="location.reload()">
      Cancel
    </button>

  </div>
</div>


<!-- MEETING -->
<div id="meeting">

  <div class="topbar">

    <div>
      <div class="brand">💎 VIP Meet</div>
      <div class="roomInfo">
        Room: <span id="roomLabel"></span>
      </div>
    </div>

    <button class="copy" onclick="copyLink()">
      🔗 Copy Link
    </button>

  </div>


  <div id="status" class="status"></div>


  <div id="approvals" class="approvals hidden">
    <h3>👑 Join Requests</h3>
    <div id="requestList"></div>
  </div>


  <div class="content">

    <div id="videos" class="videos"></div>

  </div>


  <div class="controls">

    <button id="micBtn"
            class="control active"
            onclick="toggleMic()">
      🎤
    </button>

    <button id="camBtn"
            class="control active"
            onclick="toggleCamera()">
      📷
    </button>

    <button id="speakerBtn"
            class="control active"
            onclick="toggleSpeaker()">
      🔊
    </button>

    <input id="volume"
           class="volume"
           type="range"
           min="0"
           max="1"
           step="0.05"
           value="1"
           oninput="changeVolume(this.value)">

    <button id="screenBtn"
            class="control"
            onclick="toggleScreen()">
      🖥️
    </button>

    <button class="control leave"
            onclick="leaveMeeting()">
      📞
    </button>

  </div>

</div>


<script>

const socket = io();

let myName = "";
let roomId = "";
let isHost = false;

let localStream = null;

const peers = new Map();

let speakerOn = true;
let volume = 1;

const rtcConfig = {
  iceServers: [
    {
      urls: [
        "stun:stun.l.google.com:19302",
        "stun:stun1.l.google.com:19302"
      ]
    }
  ]
};


/* -------------------------
   UI
------------------------- */

function showHome(){
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("waiting").classList.add("hidden");
  document.getElementById("meeting").style.display = "none";
}

function showWaiting(){
  document.getElementById("home").classList.add("hidden");
  document.getElementById("waiting").classList.remove("hidden");
  document.getElementById("meeting").style.display = "none";
}

function showMeeting(){
  document.getElementById("home").classList.add("hidden");
  document.getElementById("waiting").classList.add("hidden");
  document.getElementById("meeting").style.display = "block";
  document.getElementById("roomLabel").textContent = roomId;
}

function status(message){
  const el = document.getElementById("status");

  el.textContent = message;
  el.style.display = "block";

  setTimeout(() => {
    el.style.display = "none";
  }, 2500);
}


/* -------------------------
   MEDIA
------------------------- */

async function getMedia(){

  try{

    localStream = await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:true
    });

    addVideo(
      socket.id,
      myName + " (You)",
      localStream,
      true
    );

  }catch(err){

    console.error(err);

    status(
      "Camera/Mic permission required."
    );

    try{

      localStream = await navigator.mediaDevices.getUserMedia({
        video:true,
        audio:false
      });

      addVideo(
        socket.id,
        myName + " (You)",
        localStream,
        true
      );

    }catch(e){

      alert(
        "Camera permission nahi mili."
      );

    }
  }
}


/* -------------------------
   CREATE
------------------------- */

async function createMeeting(){

  myName =
    document.getElementById("name").value.trim();

  roomId =
    document.getElementById("roomId").value.trim();

  if(!myName || !roomId){
    alert("Name aur Meeting ID enter karo.");
    return;
  }

  isHost = true;

  socket.emit("create-room", {
    roomId,
    name:myName
  });

}


/* -------------------------
   JOIN
------------------------- */

function joinMeeting(){

  myName =
    document.getElementById("name").value.trim();

  roomId =
    document.getElementById("roomId").value.trim();

  if(!myName || !roomId){
    alert("Name aur Meeting ID enter karo.");
    return;
  }

  socket.emit("request-join", {
    roomId,
    name:myName
  });

}


/* -------------------------
   SERVER EVENTS
------------------------- */

socket.on("room-created", async data => {

  roomId = data.roomId;

  showMeeting();

  await getMedia();

  status("Meeting created 👑");

});


socket.on("waiting-approval", () => {

  showWaiting();

});


socket.on("approved", async data => {

  roomId = data.roomId;

  showMeeting();

  await getMedia();

  status("Host approved you ✅");

});


socket.on("join-rejected", message => {

  alert(message || "Join rejected.");

  showHome();

});


socket.on("error-message", message => {

  alert(message);

});


/* -------------------------
   ROOM USERS
------------------------- */

socket.on("room-users", users => {

  if(!isHost) return;

  if(users.users.length > 1){
    document.title =
      "VIP Meet • " + users.users.length + " Users";
  }

});


/* -------------------------
   HOST APPROVAL
------------------------- */

socket.on("join-request", request => {

  if(!isHost) return;

  document
    .getElementById("approvals")
    .classList.remove("hidden");

  const list =
    document.getElementById("requestList");

  const div =
    document.createElement("div");

  div.className = "request";

  div.id =
    "request-" + request.id;

  div.innerHTML = `
    <div style="margin-bottom:8px">
      👤 ${escapeHtml(request.name)}
    </div>

    <button class="approve"
      onclick="approveUser('${request.id}')">
      Approve
    </button>

    <button class="reject"
      onclick="rejectUser('${request.id}')">
      Reject
    </button>
  `;

  list.appendChild(div);

});


function approveUser(id){

  socket.emit("approve-user", {
    userId:id
  });

  removeRequest(id);
}


function rejectUser(id){

  socket.emit("reject-user", {
    userId:id
  });

  removeRequest(id);
}


function removeRequest(id){

  const el =
    document.getElementById("request-" + id);

  if(el) el.remove();

  const list =
    document.getElementById("requestList");

  if(!list.children.length){

    document
      .getElementById("approvals")
      .classList.add("hidden");

  }
}


/* -------------------------
   WEBRTC
------------------------- */

function createPeer(userId, userName, initiator){

  if(peers.has(userId)){
    return peers.get(userId);
  }

  const pc =
    new RTCPeerConnection(rtcConfig);

  peers.set(userId, {
    pc,
    name:userName
  });


  /* LOCAL TRACKS */

  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {

        pc.addTrack(
          track,
          localStream
        );

      });

  }


  /* REMOTE TRACK */

  pc.ontrack = event => {

    let stream =
      event.streams && event.streams[0];

    if(!stream){

      stream = new MediaStream([
        event.track
      ]);

    }

    addVideo(
      userId,
      userName,
      stream,
      false
    );

  };


  /* ICE */

  pc.onicecandidate = event => {

    if(event.candidate){

      socket.emit("ice-candidate", {
        to:userId,
        candidate:event.candidate
      });

    }

  };


  pc.onconnectionstatechange = () => {

    const state =
      pc.connectionState;

    console.log(
      "Peer",
      userId,
      state
    );

    if(
      state === "failed" ||
      state === "closed" ||
      state === "disconnected"
    ){

      setTimeout(() => {

        if(
          peers.has(userId) &&
          pc.connectionState !== "connected"
        ){

          removePeer(userId);

        }

      },3000);

    }

  };


  if(initiator){

    makeOffer(userId, pc);

  }

  return {
    pc,
    name:userName
  };
}


/* OFFER */

async function makeOffer(userId, pc){

  try{

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(offer);

    socket.emit("offer", {
      to:userId,
      offer:pc.localDescription
    });

  }catch(err){

    console.error(
      "Offer error:",
      err
    );

  }

}


/* NEW USER */

socket.on("user-joined", user => {

  if(user.id === socket.id) return;

  /*
   Existing user creates offer
   for newly joined user.
  */

  createPeer(
    user.id,
    user.name,
    true
  );

});


/* EXISTING USER */

socket.on("existing-user", user => {

  if(user.id === socket.id) return;

  /*
   New user waits for offer.
  */

  createPeer(
    user.id,
    user.name,
    false
  );

});


/* OFFER RECEIVED */

socket.on("offer", async data => {

  try{

    let peer =
      peers.get(data.from);

    if(!peer){

      peer =
        createPeer(
          data.from,
          "Participant",
          false
        );

    }

    const pc = peer.pc;

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        data.offer
      )
    );

    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(
      answer
    );

    socket.emit("answer", {
      to:data.from,
      answer:pc.localDescription
    });

  }catch(err){

    console.error(
      "Offer handling error:",
      err
    );

  }

});


/* ANSWER */

socket.on("answer", async data => {

  const peer =
    peers.get(data.from);

  if(!peer) return;

  try{

    await peer.pc.setRemoteDescription(
      new RTCSessionDescription(
        data.answer
      )
    );

  }catch(err){

    console.error(
      "Answer error:",
      err
    );

  }

});


/* ICE */

socket.on("ice-candidate", async data => {

  const peer =
    peers.get(data.from);

  if(!peer) return;

  try{

    await peer.pc.addIceCandidate(
      new RTCIceCandidate(
        data.candidate
      )
    );

  }catch(err){

    console.error(
      "ICE error:",
      err
    );

  }

});


/* USER LEFT */

socket.on("user-left", data => {

  removePeer(data.id);

});


function removePeer(id){

  const peer =
    peers.get(id);

  if(peer){

    try{
      peer.pc.close();
    }catch(e){}

    peers.delete(id);

  }

  const card =
    document.getElementById(
      "card-" + id
    );

  if(card){
    card.remove();
  }

}


/* -------------------------
   VIDEO UI
------------------------- */

function addVideo(
  id,
  name,
  stream,
  local
){

  let card =
    document.getElementById(
      "card-" + id
    );

  let video;

  if(!card){

    card =
      document.createElement("div");

    card.className =
      "videoCard";

    card.id =
      "card-" + id;

    video =
      document.createElement("video");

    video.autoplay = true;
    video.playsInline = true;

    if(local){
      video.muted = true;
    }

    const tag =
      document.createElement("div");

    tag.className =
      "nameTag";

    tag.innerHTML =
      escapeHtml(name);

    if(
      id === socket.id &&
      isHost
    ){

      tag.innerHTML +=
        ' <span class="hostBadge">👑 HOST</span>';

    }

    card.appendChild(video);
    card.appendChild(tag);

    document
      .getElementById("videos")
      .appendChild(card);

  }else{

    video =
      card.querySelector("video");

  }

  if(video.srcObject !== stream){

    video.srcObject = stream;

  }

  video.muted =
    local ? true : !speakerOn;

  video.volume =
    local ? 0 : volume;

  video.play().catch(() => {});

}


/* -------------------------
   MIC
------------------------- */

function toggleMic(){

  if(!localStream) return;

  const tracks =
    localStream.getAudioTracks();

  if(!tracks.length) return;

  const enabled =
    !tracks[0].enabled;

  tracks.forEach(t => {
    t.enabled = enabled;
  });

  const btn =
    document.getElementById("micBtn");

  btn.classList.toggle(
    "active",
    enabled
  );

  btn.classList.toggle(
    "off",
    !enabled
  );

  btn.textContent =
    enabled ? "🎤" : "🔇";

}


/* -------------------------
   CAMERA
------------------------- */

function toggleCamera(){

  if(!localStream) return;

  const tracks =
    localStream.getVideoTracks();

  if(!tracks.length) return;

  const enabled =
    !tracks[0].enabled;

  tracks.forEach(t => {
    t.enabled = enabled;
  });

  const btn =
    document.getElementById("camBtn");

  btn.classList.toggle(
    "active",
    enabled
  );

  btn.classList.toggle(
    "off",
    !enabled
  );

  btn.textContent =
    enabled ? "📷" : "🚫";

}


/* -------------------------
   SPEAKER
------------------------- */

function toggleSpeaker(){

  speakerOn =
    !speakerOn;

  document
    .querySelectorAll("#videos video")
    .forEach(video => {

      if(video.id === "local-video"){
        return;
      }

      video.muted =
        !speakerOn;

      video.volume =
        speakerOn ? volume : 0;

    });

  const btn =
    document.getElementById(
      "speakerBtn"
    );

  btn.textContent =
    speakerOn ? "🔊" : "🔇";

  btn.classList.toggle(
    "active",
    speakerOn
  );

}


/* -------------------------
   VOLUME
------------------------- */

function changeVolume(value){

  volume =
    Number(value);

  document
    .querySelectorAll("#videos video")
    .forEach(video => {

      if(video.muted) return;

      video.volume =
        volume;

    });

}


/* -------------------------
   SCREEN SHARE
------------------------- */

let screenStream = null;
let cameraTrack = null;

async function toggleScreen(){

  if(screenStream){

    stopScreen();

    return;

  }

  try{

    screenStream =
      await navigator.mediaDevices
      .getDisplayMedia({
        video:true
      });

    const screenTrack =
      screenStream.getVideoTracks()[0];

    if(localStream){

      cameraTrack =
        localStream.getVideoTracks()[0] || null;

    }

    /*
      Replace camera track
      in every peer.
    */

    for(const {pc} of peers.values()){

      const sender =
        pc.getSenders()
          .find(
            s =>
              s.track &&
              s.track.kind === "video"
          );

      if(sender){

        await sender.replaceTrack(
          screenTrack
        );

      }

    }

    const localVideo =
      document.querySelector(
        "#card-" + socket.id + " video"
      );

    if(localVideo){

      localVideo.srcObject =
        screenStream;

    }

    screenTrack.onended =
      stopScreen;

    document
      .getElementById("screenBtn")
      .classList.add("active");

  }catch(err){

    console.error(err);

  }

}


async function stopScreen(){

  if(!screenStream) return;

  const old =
    screenStream;

  screenStream = null;

  const track =
    old.getVideoTracks()[0];

  if(track){
    track.stop();
  }

  if(localStream){

    cameraTrack =
      localStream.getVideoTracks()[0] || null;

  }

  if(cameraTrack){

    for(const {pc} of peers.values()){

      const sender =
        pc.getSenders()
          .find(
            s =>
              s.track &&
              s.track.kind === "video"
          );

      if(sender){

        await sender.replaceTrack(
          cameraTrack
        );

      }

    }

    const localVideo =
      document.querySelector(
        "#card-" + socket.id + " video"
      );

    if(localVideo){

      localVideo.srcObject =
        localStream;

    }

  }

  document
    .getElementById("screenBtn")
    .classList.remove("active");

}


/* -------------------------
   COPY LINK
------------------------- */

async function copyLink(){

  const url =
    location.origin +
    "?room=" +
    encodeURIComponent(roomId);

  try{

    await navigator.clipboard.writeText(url);

    status("Meeting link copied 🔗");

  }catch(err){

    prompt(
      "Copy this meeting link:",
      url
    );

  }

}


/* -------------------------
   AUTO ROOM FROM URL
------------------------- */

const params =
  new URLSearchParams(
    location.search
  );

const urlRoom =
  params.get("room");

if(urlRoom){

  document
    .getElementById("roomId")
    .value = urlRoom;

}


/* -------------------------
   LEAVE
------------------------- */

function leaveMeeting(){

  if(!confirm("Leave meeting?")){
    return;
  }

  if(screenStream){
    stopScreen();
  }

  if(localStream){

    localStream
      .getTracks()
      .forEach(t => t.stop());

  }

  for(const {pc} of peers.values()){

    try{
      pc.close();
    }catch(e){}

  }

  peers.clear();

  socket.emit("leave-room");

  location.href =
    location.pathname;

}


/* -------------------------
   MEETING ENDED
------------------------- */

socket.on("meeting-ended", () => {

  alert(
    "Host has ended the meeting."
  );

  location.href =
    location.pathname;

});


/* -------------------------
   ESCAPE HTML
------------------------- */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

------------------------- */

showHome();
